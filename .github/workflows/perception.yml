name: Perception software
on: [push, pull_request]
jobs:
  rgbd:
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU perception dependencies
        run: |
          apt-get update
          apt-get install -y python3-pytest python3-opencv python3-numpy python3-yaml ros-humble-cv-bridge ros-humble-message-filters ros-humble-tf2-ros
      - name: Build, geometry evaluation, live ROS contract
        shell: bash
        run: bash scripts/perception_software_check.sh
