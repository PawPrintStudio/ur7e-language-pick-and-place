# The lab's chess set, for lab_chess.py. Measure with a ruler, then set
# measured: true. The numbers below are a typical club set (king 95 mm)
# and are placeholders until then.
#
# height_m  base to top.
# grip_m    measured: height above the base where the pads close (the fingertip
#           ends go 5 mm below it). Without it: 28 mm below the top (finger_reach).
# width_mm  what the RG2 READS once closed on the piece, not the ruler width: its
#           pads read 9.3 mm closed on nothing (2026-10-10). For a piece with
#           grip_m (or with measured: true) a reading more than
#           width_tolerance_mm away from it counts as a miss (issue C4).
# base_mm   base diameter: the jaw opening must clear the neighbours.
# open_mm   jaw opening before the descent. The open jaws straddle the piece
#           and must clear its diagonal neighbours: squares of s mm put them
#           1.4 s apart, so 50 mm is safe from about 45 mm squares up.
measured: false
# Ruler, 2026-10-10. With it set, heights come from the corner touches alone and
# lab_table.json (the project-1 robot's table) is not used: see use_board_surface().
board_thickness_m: 0.020
# 36 mm squares (2026-10-10 board): 50 would reach the neighbours. 32 clears the
# measured pawn (15 mm at the grip) by 8 mm a side; recheck as pieces are measured.
open_mm: 32
# Lenient: anything from 14 mm up is a piece in the jaws for the pawn below; an
# empty close reads 9.3, so a real miss is still caught.
width_tolerance_mm: 7
pieces:
  # Heights from the camera, full set in the start position (2026-10-11, the arm
  # out of the way where it could be): median of each type, both colours. With
  # --vision every pick measures its own piece anyway; these feed the carry
  # clearance and moves without --vision. Widths are placeholders except the pawn.
  k: {height_m: 0.074, width_mm: 24}   # e1 read 74; d1 read 82 -- check K/Q are not swapped
  q: {height_m: 0.082, width_mm: 24}
  b: {height_m: 0.062, width_mm: 20}   # c1 63, c8 60-62
  n: {height_m: 0.054, width_mm: 26}   # b1 55, g1 52-53, b8 53
  r: {height_m: 0.048, width_mm: 26}   # a1 49, a8 46
  # Ruler 2026-10-10: 40 mm tall, 15 mm head, 18 mm base (camera: 37-41). Grip lowered
  # from 37 to 30 mm after the first try; the RG2 read 21.8 / 21.9 mm closed on the head.
  p: {height_m: 0.040, grip_m: 0.030, width_mm: 21, base_mm: 18}
