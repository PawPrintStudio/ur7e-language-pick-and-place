# How the tool stack is mounted on THIS arm. Geometry that the CAD fixes lives
# in lab_tooling.py; these are the settings only the real arm can confirm.
# See docs/vendor/cad/README.md ("Checking lab_tooling.yaml on the arm").
#
# lab_pick.py --execute refuses to move the real robot until a person has
# checked every value below on the arm and set verified: true.
#
# Chess arm (2026-10-10): RG2 bolted straight to the flange, no changer.
# The project-1 arm (Dual Quick Changer, verified 2026-10-08) was:
#   mount: dual, changer_yaw_deg: 180.0, rg2_face: '+x', rg2_roll_deg: 90.0,
#   rg2_tcp_m: 0.202, tcp_to_tips_m: 0.045, verified: true

# 2026-10-10: accepted WITHOUT measuring (Nikola). The length is the manual's:
# for a straight-down tool every height comes from the corner touches, so a
# length error cancels between touch and move. rg2_roll_deg is still a guess:
# check the jaw direction on the first `goto --touch` hover.
verified: true
mount: single           # 'single': RG2 on the flange axis; 'dual': Dual Quick Changer
rg2_roll_deg: -90.0     # RG2 turned about the flange axis (jaw direction); -90 = Gazebo's mount
rg2_tcp_m: 0.202        # RG2 TCP from the flange (OnRobot manual 8.3.1: 200 mm); not measured
tcp_to_tips_m: 0.045    # closed fingertips beyond the TCP; conservative (mesh max 233.6 mm)
