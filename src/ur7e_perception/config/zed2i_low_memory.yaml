# Pass as ros_params_override_path to zed_wrapper/zed_camera.launch.py.
# Verify against the installed wrapper release before lab acceptance.
/**:
  ros__parameters:
    general:
      grab_resolution: HD720
      grab_frame_rate: 15
      pub_resolution: NATIVE
      pub_frame_rate: 15.0
    depth:
      depth_mode: NEURAL_LIGHT
      depth_stabilization: 0
      openni_depth_mode: false
    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false
    mapping:
      mapping_enabled: false
    object_detection:
      od_enabled: false
    body_tracking:
      bt_enabled: false
# Do not set point_cloud_freq=0: current upstream interprets it as unlimited.
# Point clouds are subscriber-driven. Do not subscribe or include them in bags.
