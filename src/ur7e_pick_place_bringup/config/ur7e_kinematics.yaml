# pick_ik replaces KDL as the IK solver for the arm group (D6 in
# docs/ARCHITECTURE.md, task 1.4): better behavior near the e-Series wrist
# singularities than KDL, one-line config change (PickNik, Humble apt —
# ros-humble-pick-ik). The vendored ur_onrobot_moveit_config/config/
# kinematics.yaml ships KDL; this file is OUR override, loaded instead by
# ur7e_pick_place_bringup's MoveIt launch. Group name (`ur_onrobot_manipulator`)
# must match the vendored SRDF (ur_onrobot_macro.srdf.xacro) — it isn't
# renamed per ur_type, see that file's own comment on why.
ur_onrobot_manipulator:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  # pick_ik-specific tuning.
  #
  # Found the hard way (2026-09-24, remote sim session): the first version of
  # this file used `mode: global` + `minimal_displacement_weight: 0.0`, which
  # is the wrong combination for what motion_node actually does — every
  # primitive (approach_above, cartesian_descend/lift, retreat) is a SMALL
  # move relative to wherever the arm already is. `global` mode samples
  # broadly across the whole configuration space instead of searching near
  # the current joints, and weight 0.0 told it not to prefer nearby solutions
  # even when it found one — so a small Cartesian nudge could come back as a
  # valid IK solution with the wrist spun an extra full turn. Visually: the
  # arm takes weirdly indirect paths. Practically: mock hardware doesn't wrap
  # continuous joints, so those extra turns accumulate across a session until
  # a later plan fails outright with no explanation (see docs/SIMULATION.md's
  # mock-hardware quirk note).
  #
  # `local` mode searches from the current seed state (gradient descent, not
  # global sampling) and a positive `minimal_displacement_weight` explicitly
  # penalizes solutions that move joints further than necessary — together,
  # the solver now prefers the smallest motion that reaches the target,
  # which is what every one of our primitives actually wants.
  mode: local
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.001
  orientation_threshold: 0.01
  cost_threshold: 0.001
  minimal_displacement_weight: 1.0
  gd_step_size: 0.0001
